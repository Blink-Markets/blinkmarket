# Local development only. No application adapters are connected yet.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: blink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  blink-postgres:
