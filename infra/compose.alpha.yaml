# Local container smoke for the three service images: PostgreSQL + Anvil (chain ID 84532) + api, worker,
# and indexer. Local only: test keys, no real RPC, nothing is deployed. `pnpm images:smoke` provisions
# the database and deployment, and passes every value below in the environment; the file itself
# holds no secret, and `docker compose` refuses to start a service whose required value is missing.
name: blink-alpha

x-service: &service
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy
    anvil:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: ${ALPHA_POSTGRES_PASSWORD:?set by images:smoke}
      POSTGRES_DB: blink
    ports:
      - "127.0.0.1:${ALPHA_POSTGRES_PORT:-55420}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink"]
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint:
      [
        "anvil",
        "--host",
        "0.0.0.0",
        "--chain-id",
        "84532",
        "--base-fee",
        "1",
        "--gas-price",
        "1",
        "--block-time",
        "1",
        "--silent",
      ]
    ports:
      - "127.0.0.1:${ALPHA_ANVIL_PORT:-58545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *service
    image: blink-api:local
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      BLINK_API_MODE: markets
      API_DATABASE_URL: ${ALPHA_API_DATABASE_URL:?set by images:smoke}
      WALLET_BINDING_ORIGIN: http://127.0.0.1:${ALPHA_API_PORT:-3001}
      SPEC_OBJECT_DIRECTORY: /data/specs
      BLINK_DEPLOYMENT_ID: ${ALPHA_DEPLOYMENT_ID:?set by images:smoke}
      BASE_SEPOLIA_RPC_URL: http://anvil:8545
    ports:
      - "127.0.0.1:${ALPHA_API_PORT:-3001}:3001"
    volumes:
      - data:/data

  indexer:
    <<: *service
    image: blink-indexer:local
    build: { context: .., dockerfile: infra/Dockerfile.indexer }
    environment:
      CHAIN_INDEXER_ENABLED: "true"
      INDEXER_TX_TRACKING_ENABLED: "true"
      INDEXER_DATABASE_URL: ${ALPHA_INDEXER_DATABASE_URL:?set by images:smoke}
      INDEXER_DEPLOYMENT_ID: ${ALPHA_DEPLOYMENT_ID:?set by images:smoke}
      BASE_SEPOLIA_RPC_URL: http://anvil:8545
    ports:
      - "127.0.0.1:${ALPHA_INDEXER_PORT:-3003}:3003"

  worker:
    <<: *service
    image: blink-worker:local
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      WORKER_ENABLED: "true"
      WORKER_DATABASE_URL: ${ALPHA_WORKER_DATABASE_URL:?set by images:smoke}
      BLINK_DEPLOYMENT_ID: ${ALPHA_DEPLOYMENT_ID:?set by images:smoke}
      BASE_SEPOLIA_RPC_URL: http://anvil:8545

volumes:
  data:
