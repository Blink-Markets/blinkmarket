name: Autonomous drill
# The reference agents through every scenario against PostgreSQL. It waits on real market close and
# dispute windows (about 18 minutes of wall clock), so it runs nightly on main and on demand
# (Actions > Autonomous drill > Run workflow) instead of on every push.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: blink_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:contracts
      - run: node --import tsx --test tests/alpha/autonomous.test.ts
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - name: Upload autonomous drill logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-autonomous
          path: tmp/alpha-autonomous/
          retention-days: 7
