name: Blink checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # pnpm check, the PostgreSQL suites, the restore drill, the build, and the infrastructure-only
    # local alpha (real API, indexer and worker against PostgreSQL and Anvil, about five minutes in
    # real time). The contract and Anvil suites run in the parallel `contracts` job, because this job
    # already took 11-19 of its former 30 minutes without them. 30 minutes is still well over the
    # loaded figure, and ends a hang that escapes every in-harness bound long before GitHub's 6-hour
    # default.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: blink_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:postgres
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - run: pnpm drill:restore:test
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - run: pnpm alpha:local
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - run: pnpm build
      - run: pnpm build:services
      - run: pnpm test:service-build
  contracts:
    runs-on: ubuntu-latest
    # Forge unit and invariant suites, the Anvil suites and the two invariant seeds. They need
    # neither PostgreSQL nor the web build. 20 minutes covers a loaded runner several times over.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Anvil suites deploy the compiled artifacts.
      - run: pnpm check:contracts
      - run: pnpm test:contracts
      - run: pnpm test:anvil
      - run: pnpm test:contracts:seeds
  browsers:
    runs-on: ubuntu-latest
    # Usually 3-4 minutes with the browser cache; one hung run took 51 minutes on GitHub's
    # 6-hour default. 20 minutes still covers a cold browser install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:browsers
      - name: GitHub Pages export builds and links resolve
        run: pnpm build:pages && node scripts/check-pages-export.mjs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
