name: Blink checks
# Planning and progress notes do not trigger a run. Docs that tests or the web build read
# (INTRO_VIDEO_SCRIPT, DEPLOYMENT_RUNBOOK, the READMEs, ...) still do. The autonomous drill runs
# nightly in autonomous.yml, because it waits on real market and dispute windows (~18 minutes).
on:
  push:
    paths-ignore: ["docs/superpowers/**", "docs/*_PROGRESS.md", "docs/ROADMAP.md"]
  pull_request:
    paths-ignore: ["docs/superpowers/**", "docs/*_PROGRESS.md", "docs/ROADMAP.md"]
permissions:
  contents: read
# A newer push to the same branch cancels the older run there; other branches keep theirs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # Typechecks, contract sizes, the unit tests (about 6 minutes), boundaries and the builds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:services
      - run: pnpm test:service-build
  postgres:
    runs-on: ubuntu-latest
    # The PostgreSQL suites and the restore drill, about two minutes.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: blink_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:contracts
      - run: pnpm test:postgres
      - run: pnpm drill:restore:test
  alpha-local:
    runs-on: ubuntu-latest
    # The infrastructure-only local alpha: real API, indexer and worker against PostgreSQL and
    # Anvil, about five and a half minutes in real time.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: blink_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm alpha:local
  contracts:
    runs-on: ubuntu-latest
    # Forge unit and invariant suites, the Anvil suites and the two invariant seeds. They need
    # neither PostgreSQL nor the web build. 20 minutes covers a loaded runner several times over.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Anvil suites deploy the compiled artifacts.
      - run: pnpm check:contracts
      - run: pnpm test:contracts
      - run: pnpm test:anvil
      - run: pnpm test:contracts:seeds
  browsers:
    runs-on: ubuntu-latest
    # Usually 3-4 minutes with the browser cache; one hung run took 51 minutes on GitHub's
    # 6-hour default. 20 minutes still covers a cold browser install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:browsers
      - name: GitHub Pages export builds and links resolve
        run: pnpm build:pages && node scripts/check-pages-export.mjs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
