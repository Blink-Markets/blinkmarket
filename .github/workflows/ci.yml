name: Blink checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # On one developer machine pnpm check, the PostgreSQL, Anvil, contract and Alpha harness
    # steps took about 2.5 minutes idle and about 9 minutes under heavy load, before install and
    # the web build. 30 minutes is over three times the loaded figure, and still ends a hang
    # that escapes every in-harness bound long before GitHub's 6-hour default.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: blink_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:postgres
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - run: pnpm drill:restore:test
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://blink_test:local-ci-only@127.0.0.1:5432/postgres
      - run: pnpm test:contracts
      - run: pnpm test:anvil
      - run: pnpm test:contracts:seeds
      - run: pnpm build
      - run: pnpm build:services
      - run: pnpm test:service-build
  browsers:
    runs-on: ubuntu-latest
    # Usually 3-4 minutes with the browser cache; one hung run took 51 minutes on GitHub's
    # 6-hour default. 20 minutes still covers a cold browser install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:browsers
      - name: GitHub Pages export builds and links resolve
        run: pnpm build:pages && node scripts/check-pages-export.mjs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
